<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/checkout.css">
    <link rel="apple-touch-icon" href="https://mms.img.susercontent.com/vn-11134216-820l4-mere45bu6qyt7b_tn">
<link rel="icon" sizes="32x32" href="https://mms.img.susercontent.com/vn-11134216-820l4-mere45bu6qyt7b_tn">
<link rel="icon" sizes="64x64" href="https://mms.img.susercontent.com/vn-11134216-820l4-mere45bu6qyt7b_tn">
</head>
<body>
    
<div class="checkout-container">

    <!-- LEFT -->
    <div class="checkout-cart">

        <h2>Sản phẩm đã chọn</h2>

        <div id="cartItems"></div>

    </div>

    <!-- RIGHT -->
    <div class="form">

        <h1>Checkout Page</h1>

        <input
            type="text"
            id="fullname"
            placeholder="Họ và tên"
        >

        <input
            type="text"
            id="phone"
            placeholder="Số điện thoại"
        >

        <textarea
            id="address"
            placeholder="Địa chỉ"
        ></textarea>

        <!-- PAYMENT -->
        <div class="payment-method">

            <h2>Phương thức thanh toán</h2>

            <label class="payment-card">

            <input
                type="radio"
                name="payment"
                value="COD"
            >

            <img
                src="https://cdn-icons-png.flaticon.com/512/2489/2489756.png"
                class="payment-logo"
            >

            <div class="payment-info">

                <h3>Thanh toán khi nhận hàng</h3>

                <p>
                    Trả tiền mặt cho shipper
                </p>

            </div>

        </label>


        <!-- MOMO -->
        <label class="payment-card">

            <input
                type="radio"
                name="payment"
                value="MOMO"
                checked
            >

            <img
                src="https://cdn.tgdd.vn/2020/03/GameApp/Untitled-2-200x200.jpg"
                class="payment-logo"
            >

            <div class="payment-info">

                <h3>Ví MoMo</h3>

                <p>
                    Thanh toán nhanh bằng ví điện tử
                </p>

            </div>

        </label>

        <!-- VNPAY -->
        <label class="payment-card">

            <input
                type="radio"
                name="payment"
                value="VNPAY"
            >

            <img
                src="https://cdn.haitrieu.com/wp-content/uploads/2022/10/Icon-VNPAY-QR.png"
                class="payment-logo"
            >

            <div class="payment-info">

                <h3>VNPay</h3>

                <p>
                    Thanh toán bằng QR hoặc ATM
                </p>

            </div>

        </label>

        <!-- BANK -->
        <label class="payment-card">

            <input
                type="radio"
                name="payment"
                value="BANK"
            >

            <img
                src="https://cdn-icons-png.flaticon.com/512/2830/2830284.png"
                class="payment-logo"
            >

            <div class="payment-info">

                <h3>Chuyển khoản ngân hàng</h3>

                <p>
                    Chuyển khoản trực tiếp qua ngân hàng
                </p>

            </div>

        </label>
        <!-- Master Card -->
        <label class="payment-card">

            <input
                type="radio"
                name="payment"
                value="MASTER"
            >

            <img
                src="https://upload.wikimedia.org/wikipedia/commons/a/a4/Mastercard_2019_logo.svg"
                class="payment-logo"
            >

            <div class="payment-info">

                <h3>Master Card</h3>

                <p>
                    Chi tiêu trước, trả tiền sau.
                </p>

            </div>

        </label>
        </div>

        <button onclick="placeOrder()">
            Đặt hàng
        </button>

    </div>

</div>

</div>
</body>
<script src="./js/checkout.js"></script>
</html>

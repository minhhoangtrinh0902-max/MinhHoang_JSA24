<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login
    </title>

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="./css/login.css"
    >

    <!-- FONT AWESOME -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >

</head>

<body>

    <!-- ================= LOADING ================= -->

    <div
        id="loadingOverlay"
        class="hidden"
    >

        <div class="spinner"></div>

    </div>

    <!-- ================= LOGIN BOX ================= -->

    <div class="form-wrapper">

        <!-- TITLE -->

        <h2>
            Sign In
        </h2>

        <!-- FORM -->

        <form id="loginForm">

            <!-- USERNAME -->

            <div class="form-control">

                <input
                    type="text"
                    id="username"
                    required
                >

                <label for="username">
                    Username
                </label>

            </div>

            <!-- PASSWORD -->

            <div class="form-control password-box">

                <input
                    type="password"
                    id="password"
                    required
                >

                <label for="password">
                    Password
                </label>

                <!-- SHOW / HIDE PASSWORD -->

                <span id="togglePassword">

                    <i
                        id="eyeIcon"
                        class="fa-solid fa-eye"
                    ></i>

                </span>

            </div>

            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                id="loginBtn"
            >

                Sign In

            </button>

            <!-- HELP -->

            <div class="form-help">

                <div class="remember-me">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    <label for="remember">
                        Remember me
                    </label>

                </div>

                <a href="#">
                    Need help?
                </a>

            </div>

        </form>

        <!-- REGISTER -->

        <p class="register-text">

            New to MH Shop?

            <a href="./register.html">
                Sign up now
            </a>

        </p>

    </div>

    <!-- ================= JS ================= -->

    <script src="./js/login.js"></script>

</body>

</html>

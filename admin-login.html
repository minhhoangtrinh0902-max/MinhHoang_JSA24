<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Admin Login
    </title>

    <link
        rel="stylesheet"
        href="./css/admin-login.css"
    >

</head>

<body>

    <!-- ================= LOGIN BOX ================= -->

    <div class="login-box">

        <h2>
            Đăng nhập Admin
        </h2>

        <input
            type="text"
            id="username"
            placeholder="Tên đăng nhập"
        >

        <input
            type="password"
            id="password"
            placeholder="Mật khẩu"
        >

        <!-- BUTTON LOGIN -->

        <button
            id="loginBtn"
            onclick="login()"
        >

            <span id="btnText">
                Đăng nhập
            </span>

            <div id="spinner"></div>

        </button>

        <p id="error"></p>

        <!-- BUTTON LOGOUT -->

        <button
            class="logout-btn"
            onclick="logout()"
        >
            Quay lại
        </button>

    </div>

    <!-- ================= LOADING OVERLAY ================= -->

    <div
        class="loading-overlay"
        id="loadingOverlay"
    >

        <div class="loader"></div>

    </div>

    <script src="./js/admin-login.js"></script>

</body>

</html>

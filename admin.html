<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Admin - MH Shoes Store
    </title>

    <link
        rel="stylesheet"
        href="./css/admin.css"
    >

</head>

<body>

<!-- ================= HEADER ================= -->

<header>

    <h1>
        Trang Quản Trị Sản Phẩm
    </h1>

    <!-- RIGHT ACTIONS -->

    <div class="header-actions">

        <!-- TOTAL PRODUCT -->

        <div class="product-count">

            Tổng:
            <span id="totalProducts">
                0
            </span>

        </div>

        <!-- LOGOUT BUTTON -->

        <button
            class="logout-btn"
            onclick="logout()"
        >
            Đăng xuất
        </button>

    </div>

</header>

<!-- ================= MAIN ================= -->

<main class="container">

    <!-- ================= FORM ================= -->

    <section class="form-box">

        <h2>
            Thêm / Sửa sản phẩm
        </h2>

        <form id="productForm">

            <input
                type="hidden"
                id="productId"
            >

            <!-- NAME -->

            <div class="input-group">

                <label>
                    Tên sản phẩm
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Nhập tên sản phẩm"
                    required
                >

            </div>

            <!-- PRICE -->

            <div class="input-group">

                <label>
                    Giá
                </label>

                <input
                    type="number"
                    id="price"
                    placeholder="Nhập giá sản phẩm"
                    required
                >

            </div>

            <!-- CATEGORY -->

            <div class="input-group">

                <label>
                    Danh mục
                </label>

                <select id="category">

                    <option value="all">
                        Tất cả danh mục
                    </option>

                    <option value="lifestyle">
                        Thời trang
                    </option>

                    <option value="running">
                        Chạy bộ
                    </option>

                    <option value="football">
                        Bóng đá
                    </option>

                    <option value="basketball">
                        Bóng rổ
                    </option>

                    <option value="accessories">
                        Phụ kiện
                    </option>

                </select>

            </div>

            <!-- IMAGE -->

            <div class="input-group">

                <label>
                    Ảnh (URL)
                </label>

                <input
                    type="text"
                    id="img"
                    placeholder="Dán link ảnh sản phẩm"
                    required
                >

            </div>

            <!-- IMAGE PREVIEW -->

            <div class="preview-box">

                <img
                    id="previewImage"
                    src="https://via.placeholder.com/200x200?text=Preview"
                    alt="Preview"
                >

            </div>

            <!-- SAVE BUTTON -->

            <button
                type="submit"
                class="btn-save"
            >
                Lưu sản phẩm
            </button>

        </form>

    </section>

    <!-- ================= TABLE ================= -->

    <section class="table-box">

        <!-- TOP BAR -->

        <div class="table-top">

            <h2>
                Danh sách sản phẩm
            </h2>

            <!-- SEARCH -->

            <input
                type="text"
                id="searchInput"
                placeholder="Tìm sản phẩm..."
            >

        </div>

        <!-- TABLE -->

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Ảnh</th>

                    <th>Tên</th>

                    <th>Giá</th>

                    <th>Danh mục</th>

                    <th>Hành động</th>

                </tr>

            </thead>

            <tbody id="productList"></tbody>

        </table>

    </section>

</main>

<!-- ================= LOADING ================= -->

<div
    class="loading-overlay"
    id="loadingOverlay"
>

    <div class="loader"></div>

</div>

<!-- ================= TOAST ================= -->

<div
    class="toast"
    id="toast"
>

    Thành công

</div>

<!-- ================= SCRIPT ================= -->

<script src="./js/admin.js"></script>

<script>

// ================= CHECK LOGIN =================

if(

    !localStorage.getItem(
        "admin_login"
    )

){

    window.location.href =
        "admin-login.html";

}

// ================= LOGOUT =================

function logout(){

    localStorage.removeItem(
        "admin_login"
    );

    window.location.href =
        "admin-login.html";

}

// ================= IMAGE PREVIEW =================

const imgInput =
    document.getElementById("img");

const previewImage =
    document.getElementById("previewImage");

imgInput.addEventListener(

    "input",

    function(){

        previewImage.src =
            imgInput.value ||

            "https://via.placeholder.com/200x200?text=Preview";

    }

);

</script>

</body>
</html>
